description: Contact successfully created
content:
  application/json:
    schema:
      type: object
      properties:
        _id:
          type: string
          example: '65ca67e7ae7f10c88b598384'
        name:
          type: string
          example: 'John Doe'
        phoneNumber:
          type: string
          example: '0-800-500-300'
        email:
          type: string
          example: 'john.doe@example.com'
        isFavourite:
          type: boolean
          example: false
        contactType:
          type: string
          example: 'work'
        photoUrl:
          type: string
          example: 'https://res.cloudinary.com/dizemssqk/image/upload/v1749464985/czwxgqezmt9gxdogod0i.png'
